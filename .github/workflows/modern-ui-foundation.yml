name: Modern UI foundation
on:
  push:
    branches: ["feat/modern-ui-foundation"]
    paths:
      - "frontend-next/**"
      - ".github/workflows/modern-ui-foundation.yml"
  pull_request:
    paths:
      - "frontend-next/**"
      - ".github/workflows/modern-ui-foundation.yml"

permissions:
  contents: read

jobs:
  modern-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - name: Install locked dependencies
        run: npm --prefix frontend-next ci --no-audit --no-fund
      - name: TypeScript
        run: npm --prefix frontend-next run typecheck
      - name: ESLint
        run: npm --prefix frontend-next run lint
      - name: Unit and component tests
        run: npm --prefix frontend-next test
      - name: Production build
        run: npm --prefix frontend-next run build
