name: Modern UI preview checks

on:
  push:
    branches:
      - feat/modern-ui-gui-hardening
  pull_request:
    paths:
      - 'frontend-next/**'
      - 'docs/ui-modernization/**'
      - '.github/workflows/modern-ui-preview-checks.yml'

permissions:
  contents: read

jobs:
  frontend-next:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Production-mode preview build (not deployed)
        run: npm run build
