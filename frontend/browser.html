<div class="row g-3 app-split-page app-fixed-split-page">
    <!-- LEFT: Search, Filter & Tree (60%) -->
    <div class="col-md-7">
        <!-- Search & Filter Card -->
        <div class="card shadow-sm mb-3">
            <div class="card-header">
                <div class="app-card-header-main">
                    <h2 class="h6 fw-semibold mb-0 lh-base"><i class="fas fa-filter me-2 app-header-icon is-neutral"></i> Browse</h2>
                </div>
                <div class="app-card-header-actions">
                    <span class="badge badge-soft-light" id="browser-tree-count">0</span>
                </div>
            </div>
            <div class="card-body p-3">

                <!-- View Toggle -->
                <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                    <div class="btn-group btn-group-sm" role="group">
                        <button type="button" class="btn btn-sm btn-app-primary" id="btn-view-module"
                                onclick="BrowserModule.switchView('module')">
                            <i class="fas fa-book"></i> By Module
                        </button>
                        <button type="button" class="btn btn-sm btn-app-secondary" id="btn-view-oid"
                                onclick="BrowserModule.switchView('oid')">
                            <i class="fas fa-sitemap"></i> By OID
                        </button>
                    </div>
                </div>

                <!-- Search Input -->
                <div class="mb-3" id="search-section">
                    <div class="input-group">
                        <span class="input-group-text app-input-group-text">
                            <i class="fas fa-search text-muted"></i>
                        </span>
                        <input type="text" id="browser-search-input" class="form-control"
                               placeholder="Search names, OIDs, or descriptions..."
                               aria-label="Search MIBs"
                               oninput="BrowserModule.debounceSearch()">
                        <button type="button" class="btn btn-app-secondary btn-icon d-none"
                                onclick="BrowserModule.clearSearch()"
                                id="btn-clear-search"
                                title="Clear search"
                                aria-label="Clear search">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="form-text small">
                        Examples: <code>ifDescr</code>, <code>1.3.6.1.2.1.1.1</code>, <code>interface</code>
                    </div>
                </div>

                <!-- Filters Row (Module View only) -->
                <div id="filters-section">
                    <div class="row g-2 mb-2">
                        <div class="col-md-5">
                            <label for="browser-module-filter" class="form-label small fw-bold mb-1">Module</label>
                            <select id="browser-module-filter" class="form-select form-select-sm"
                                    onchange="BrowserModule.applyFilters()">
                                <option value="">All Modules</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="browser-type-filter" class="form-label small fw-bold mb-1">Type</label>
                            <select id="browser-type-filter" class="form-select form-select-sm"
                                    onchange="BrowserModule.applyFilters()">
                                <option value="">All Types</option>
                                <option value="MibScalar">Scalars</option>
                                <option value="MibTable">Tables</option>
                                <option value="MibTableColumn">Columns</option>
                                <option value="NotificationType">Traps</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button type="button" class="btn btn-sm btn-app-secondary w-100"
                                    onclick="BrowserModule.clearFilters()">
                                <i class="fas fa-eraser"></i> Clear
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tree Card -->
        <div class="card shadow-sm app-split-fill">
            <div class="card-header" id="tree-controls">
                <div class="app-card-header-main">
                    <h2 class="h6 fw-semibold mb-0 lh-base">
                        <i class="fas fa-sitemap me-2 app-header-icon is-primary"></i>
                        <span id="browser-tree-title">MIB Tree</span>
                    </h2>
                </div>
                <div class="app-card-header-actions">
                    <div class="btn-group btn-group-sm">
                        <button type="button" class="btn btn-app-secondary" onclick="BrowserModule.exportCurrentView('json')">
                            <i class="fas fa-file-code me-1"></i> JSON
                        </button>
                        <button type="button" class="btn btn-app-secondary" onclick="BrowserModule.exportCurrentView('csv')">
                            <i class="fas fa-file-csv me-1"></i> CSV
                        </button>
                    </div>
                    <label for="expand-depth-select" class="small app-inline-label">Depth:</label>
                    <select class="form-select form-select-sm" id="expand-depth-select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                    <div class="btn-group btn-group-sm">
                        <button type="button" class="btn btn-app-secondary"
                                onclick="BrowserModule.expandToSelectedDepth()"
                                id="btn-expand">
                            <i class="fas fa-plus-square me-1"></i> Expand
                        </button>
                        <button type="button" class="btn btn-app-secondary"
                                onclick="BrowserModule.collapseAll()">
                            <i class="fas fa-minus-square me-1"></i> Collapse
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <div id="browser-tree-container" class="app-scroll-panel app-split-fill-region">
                    <div class="app-panel-placeholder is-loading">
                        <span class="spinner-border spinner-border-sm app-tone-primary" role="status" aria-hidden="true"></span>
                        <span class="app-panel-placeholder-title">Loading tree</span>
                        <span class="app-panel-placeholder-copy">Preparing the active catalog view.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- RIGHT: Details Panel (40%) -->
    <div class="col-md-5">
        <div class="card shadow-sm app-split-fill">
            <div class="card-header">
                <div class="app-card-header-main">
                    <h2 class="h6 fw-semibold mb-0 lh-base"><i class="fas fa-info-circle me-2 app-header-icon is-info"></i> Details</h2>
                </div>
            </div>
            <div class="card-body app-scroll-panel app-split-fill-region" id="browser-details-panel">
                <div class="app-panel-placeholder">
                    <span class="app-panel-placeholder-icon"><i class="fas fa-mouse-pointer"></i></span>
                    <span class="app-panel-placeholder-title">No object selected</span>
                    <span class="app-panel-placeholder-copy">Select an item from the tree to inspect the resolved object details.</span>
                </div>
            </div>
        </div>
    </div>
</div>
