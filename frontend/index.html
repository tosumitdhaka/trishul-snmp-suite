<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Overview · Trishul SNMP Suite</title>
    <meta
      name="description"
      content="Precision Command Workbench for Trishul SNMP Suite — simulator, walker, trap console, MIB browser, and bundle manager."
    />
    <meta property="og:title" content="Trishul SNMP Suite · Workbench" />
    <meta
      property="og:description"
      content="Precision Command Workbench for Trishul SNMP Suite — simulator, walker, trap console, MIB browser, and bundle manager."
    />
    <link rel="icon" type="image/svg+xml" href="/img/trishul-icon.svg" />
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('trishul_theme');
          if (saved === 'dark' || saved === 'light') {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (_) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        root.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body class="bg-[var(--tui-bg-canvas)] text-[var(--tui-ink-primary)] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
